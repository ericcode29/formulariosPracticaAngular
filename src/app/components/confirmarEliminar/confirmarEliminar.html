<h2 mat-dialog-title>¿Eliminar vehículo?</h2>
<mat-dialog-content>Estas a punto de eliminar el vehículo del cliente</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close (click)="cancelar()">Cancelar</button>
    <button mat-raised-button mat-dialog-close (click)="eliminar()">Eliminar</button>
</mat-dialog-actions>

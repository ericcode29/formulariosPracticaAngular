<section>
    <header class="header">
        <div class="btn-accion">
            <a routerLink="''"><button mat-mini-fab>↩️</button></a>
            <button mat-mini-fab (click)="addVehiculo(cliente())">+🚗</button>
        </div>
        <h2>Vehículos de {{cliente().usuario}}</h2>
        <div class="spacer"></div>
    </header>
    <div class="cards">
        @for (v of cliente().vehiculo; track $index) {
        <mat-card appearance="outlined" class="card">
            <mat-card-header class="header-card">
                <mat-card-title>{{v.vehiculo}}</mat-card-title>
                <mat-card-subtitle>{{v.tipo}}</mat-card-subtitle>
            </mat-card-header>
            <mat-card-content class="content-card">
                <div>
                    <h4>Dispositivo</h4>
                    <p>{{v.dispositivo}}</p>
                </div>
                <div>
                    <h4>Tarjeta</h4>
                    <p>{{v.tarjeta}}</p>
                </div>
                <div>
                    <h4>Estado</h4>
                    <p>{{v.estado}}</p>
                </div>
                <div>
                    <h4>Direccion</h4>
                    <p>Calle Veosat</p>
                </div>
                <div>
                    <h4>Señal GPS</h4>
                    <p>👌</p>
                </div>
                <div>
                    <h4>Señal GSM</h4>
                    <p>✅</p>
                </div>
                <section class="mapa">
                    <img mat-card-md-image [src]="v.ultimaPosicion.src" [alt]="v.ultimaPosicion.alt">
                </section>
            </mat-card-content>
            <mat-card-footer class="footer-card">
                <button mat-mini-fab (click)="editar(v)">📝</button>
                <button mat-mini-fab (click)="eliminarVehiculo(v)">🗑️</button>
            </mat-card-footer>
        </mat-card>
        }
    </div>
</section>

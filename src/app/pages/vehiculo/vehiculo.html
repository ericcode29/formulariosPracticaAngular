<section>
    <header class="header">
        <div class="btn-accion">
            <a routerLink="''"><button mat-mini-fab>↩️</button></a>
            <button mat-mini-fab (click)="addVehiculo(cliente())">+🚗</button>
        </div>
        <h2>Vehículos de {{cliente().usuario}}</h2>
        <div class="spacer"></div>
    </header>
    <div class="cards">
        @for (v of cliente().vehiculo; track v) {
        <vehiculo-card [vehiculo]="v" />
        }
    </div>
    <div>
        <vehiculo-tabla [vehiculos]="cliente().vehiculo" />
    </div>
</section>
